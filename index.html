<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WA.io Token - Mining, Referral & Rewards Platform">
    <meta name="keywords" content="WA Token, Mining, Crypto, BNB, DeFi">
    <meta name="author" content="WA.io Team">
    
    <title>WA.io Token - ماینینگ و سیستم پاداش</title>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7989403305267753"
     crossorigin="anonymous"></script>
</head>
<body>
    <!-- Header Component -->
    <div id="header-container"></div>

    <!-- Hero Component -->
    <div id="hero-container"></div>

    <!-- Features Component -->
    <div id="features-container"></div>

    <!-- Tokenomics Component -->
    <div id="tokenomics-container"></div>

    <!-- Stats Component -->
    <div id="stats-container"></div>

    <!-- How It Works Component -->
    <div id="how-it-works-container"></div>

    <!-- Rewards Component -->
    <div id="rewards-container"></div>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <!-- Core JavaScript -->
    <script src="js/translations.js"></script>
    <script src="js/language.js"></script>
    <script src="js/app.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/mining.js"></script>
    <script src="js/security.js"></script>
    
    <!-- Component Loader -->
    <script>
        // Load component function
        async function loadComponent(name, container) {
            try {
                const response = await fetch(`components/${name}/${name}.html`);
                const html = await response.text();
                document.getElementById(container).innerHTML = html;
                
                // Load component CSS
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = `components/${name}/${name}.css`;
                document.head.appendChild(link);
                
                // Load component JS
                const script = document.createElement('script');
                script.src = `components/${name}/${name}.js`;
                script.defer = true;
                document.body.appendChild(script);
            } catch (error) {
                console.error(`Error loading ${name}:`, error);
            }
        }

        // Load all components
        async function loadAllComponents() {
            await loadComponent('header', 'header-container');
            await loadComponent('hero', 'hero-container');
            await loadComponent('features', 'features-container');
            await loadComponent('tokenomics', 'tokenomics-container');
            await loadComponent('stats', 'stats-container');
            await loadComponent('how-it-works', 'how-it-works-container');
            await loadComponent('rewards', 'rewards-container');
            await loadComponent('footer', 'footer-container');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadAllComponents);
    </script>
</body>
</html>
